    - id: river_course_shift
      version: 1
      subjectKind: historical_trace
      subjectIds:
        - river_basin
      signalKind: water_trace
      title: The river remembers another course
      question: Did the river once run through a different channel?
      summaries:
        trace: Dry cuts remain beside the present river.
        hypothesis: The basin may preserve an older course.
        discovered: Independent water traces support a former channel without fixing its cause.
      evidenceText: Sediment and a dry channel suggest water once moved here.
      evidenceRules:
        - id: river_course_shift.support
          subjectRefs:
            - river_basin
          signalKinds:
            - water_trace
          minDistinctWorldTimes: 2
          minIndependentSources: 2
