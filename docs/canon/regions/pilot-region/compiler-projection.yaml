  discoveryDefinitions:
    - id: western_waterfalls
      version: 1
      subjectKind: object
      objectIds:
        - western_cliff_waterfalls
      signalKind: landmark_trace
      title: Водопады питают реку
      question: Связаны ли потоки на западных утёсах с уровнем реки?
      summaries:
        trace: Ты увидел потоки, падающие с западных утёсов.
        hypothesis: Похоже, водопады связаны с руслом реки.
        discovered: Ты собрал повторные наблюдения: водопады остаются частью речного бассейна.
      evidenceText: С уступа падают несколько потоков; внизу слышно движение воды.
      status: runtime
      canonicalRefs:
        - regions.pilot-region.visual-interpretation.f3
        - regions.pilot-region.visual-interpretation.f5
    - id: crater_surface
      version: 1
      subjectKind: object
      objectIds:
        - glass_crater_surface
      signalKind: physical_trace
      title: Блеск Стеклянной впадины
      question: Почему поверхность впадины отражает свет?
      summaries:
        trace: На дне чаши камень блестит после дождя.
        hypothesis: Поверхность ведёт себя не как обычный камень.
        discovered: Повторные осмотры подтверждают особое отражение, но не объясняют происхождение впадины.
      evidenceText: Свет отражается от гладкого слоя; происхождение слоя остаётся неизвестным.
      status: runtime
      canonicalRefs:
        - regions.pilot-region.visual-interpretation.f5
    - id: ancient_culture_traces
      version: 1
      subjectKind: historical_trace
      subjectIds:
        - old_ruins
      signalKind: structural_trace
      title: Echoes of an older culture
      question: Were the ruins built by one older tradition?
      summaries:
        trace: The stonework repeats a pattern you have seen before.
        hypothesis: The ruins may share a building tradition with distant works.
        discovered: Independent observations support a shared older building tradition.
      evidenceText: Masonry joints and alignments repeat across the ruin.
      evidenceRules:
        - id: ancient_culture_traces.support
          subjectRefs:
            - old_ruins
          signalKinds:
            - structural_trace
          minDistinctWorldTimes: 2
          minIndependentSources: 2
      contradictionRules:
        - id: ancient_culture_traces.contradiction
          subjectRefs:
            - old_ruins
          signalKinds:
            - structural_trace
          minDistinctWorldTimes: 2
      stageThresholds:
        hypothesis: 2
        discovered: 3
      status: runtime
      canonicalRefs:
        - regions.pilot-region.history.f1
    - id: abandoned_infrastructure
      version: 1
      subjectKind: historical_trace
      subjectIds:
        - road_city_ruins
      signalKind: physical_trace
      title: Road without a destination
      question: What abandoned route once crossed the eastern heights?
      summaries:
        trace: The old road continues beyond the settled paths.
        hypothesis: The road may belong to infrastructure older than the city.
        discovered: Repeated traces support an abandoned route rather than a natural track.
      evidenceText: Cut stones and a regular grade mark an older route.
      evidenceRules:
        - id: abandoned_infrastructure.support
          subjectRefs:
            - road_city_ruins
          signalKinds:
            - physical_trace
          minDistinctWorldTimes: 2
          minIndependentSources: 2
