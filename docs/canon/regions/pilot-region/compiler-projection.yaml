      version: 1
      subjectKind: historical_trace
      subjectIds:
        - old_ruins
      signalKind: structural_trace
      title: A scar in the stone
      question: Was the eastern site damaged by conflict?
      summaries:
        trace: One masonry layer is darker and more damaged than the rest.
        hypothesis: The damage may have followed a violent event, but fire and weather remain possible.
        discovered: Repeated evidence supports a damaged layer while leaving its cause unresolved.
      evidenceText: A darkened masonry layer interrupts the older stonework.
      evidenceRules:
        - id: conflict_trace.support
          subjectRefs:
            - old_ruins
          signalKinds:
            - structural_trace
          minDistinctWorldTimes: 2
          minIndependentSources: 2
