# Simulation Registry
# Список всех Simulation Systems проекта.
# Источник для Compiler на этапе сборки мира.
# Формат: YAML до появления zod-схемы (Schema stage, D-4.4 этап 2).

registryVersion: 1.0.0
lastUpdated: "2026-08-05"

systems:
  - systemId: river-hydrology
    lifecycleStatus: Experimental
    definitionPath: docs/simulation/definitions/river-hydrology.yaml
    bindingPath: docs/simulation/bindings/pilot-region.yaml
    dependencyRank: 1              # корневая система, нет dependsOn

  - systemId: weather
    lifecycleStatus: Proposal
    definitionPath: docs/simulation/definitions/weather.yaml
    bindingPath: null              # нет реализации, нет binding
    dependencyRank: 1              # корневая система, нет dependsOn
    notes: "Weather влияет на river-hydrology через precipitation → waterInflow.
            После реализации Weather потребуется обновить river-hydrology.yaml:
            добавить dependsOn: weather (§12.2, V-04/V-10)."

