# System Definition: River Hydrology
# Первая System Definition — проверка шаблона SIMULATION_BIBLE_ARCHITECTURE.md
# на реальной существующей системе (Roadmap §15, шаг 2).
# Источник: ретро-импорт из кода (паттерн Canon A−25: код — источник, не авторитет).
# Формат: YAML до появления zod-схемы (Schema stage, D-4.4 этап 2).

identity:
  systemId: river-hydrology
  lifecycleStatus: Experimental        # D-0.3: первое вхождение в реестр
  reviewAfter: "Architecture Review шаблона (Roadmap §15, шаг 3)"
  version: 1.0.0
  provenance:
    type: ImportedFromCode             # ретро-импорт; ADR-0017 остаётся авторитетом решения
    sources:
      - docs/adr/0017-river-hydrology-and-crossing.md
      - packages/world/src/rules/river-level.ts
      - packages/world/src/rules/crossing-condition.ts
      - packages/world/src/region/types.ts

# ---------------------------------------------------------------------------
# PUBLIC CONTRACT — единственная часть, от которой вправе зависеть внешние
# потребители (Stable Interface Principle)
# ---------------------------------------------------------------------------
publicContract:

  dependencies:
    # DAG-4: каждый аспект имеет единственного владельца — эту систему.
    ownedAspects:
      - aspect: RiverState             # текущий уровень и полоса уровня водотока
        domain: "{ level: ℝ, band: RiverBand }  # level ∈ [minimumLevel, maximumLevel]"
      - aspect: CrossingState          # состояние проходимости переправы
        domain: "{ condition: open | difficult | closed }"

    # Структурных зависимостей нет: система самодостаточна.
    # TickPassed — механизм движка (D-0.2), фиксируется через Update Model ABI,
    # а не через dependsOn. Переправа и водоток существуют как spatial
    # relations из регионального bootstrap — это Binding, не зависимость.
    dependsOn: []

    influences:
      - target: spatial-movement       # ADR-0015: route resolver
        dependencyEvidence:            # обязательно (V-08)
          - "Route resolver читает crossingStates из spatial projection"
          - "CrossingConditionChanged изменяет passability: closed блокирует journey, difficult увеличивает travel cost"

  observableSurface:
    emits:
      - event: RiverProcessDefined     # bootstrap: регистрация процесса (A−5: всё — Events)
        role: genesis
      - event: RiverLevelChanged       # уровень изменился (previous/new level+band)
        role: state-transition
      - event: CrossingConditionInitialized
        role: genesis
      - event: CrossingConditionChanged  # open → difficult → closed
        role: state-transition
    consumes:
      - event: TickPassed              # единственный триггер эволюции (ABI §6.2)
    observationChannels:               # ADR-0017 §7: observer boundary
      - channel: direct-observation    # наблюдатель видит реку/переправу
      - channel: attempted-travel      # попытка перейти переправу
      - channel: proximity             # близость к водотоку
    hiddenAspects: []                  # скрытого состояния нет: истина открыта,
                                       # знание игрока отстаёт от истины честно
    discoveryCandidates:               # правило вывода §12.1
      - "Закон цикла реки: периодичность уровня обнаружима по повторным наблюдениям"
      - "Закон порогов переправы: связь уровня воды и проходимости"

  guarantees:
    - id: river-level-bounded
      statement: "River level всегда внутри [minimumLevel, maximumLevel]"
      kind: invariant
      scope: aspect
      consumer: [replay-test, rule-review]
      evidence:
        - Rule: riverLevelProcess      # packages/world/src/rules/river-level.ts
    - id: river-level-deterministic
      statement: "При одинаковом Event Log профиль уровня воспроизводится бит-в-бит (computeRiverLevel — чистая функция от process definition и worldTime)"
      kind: invariant
      scope: system
      consumer: [replay-test]
      evidence:
        - Rule: riverLevelProcess
    - id: crossing-condition-derived
      statement: "Crossing condition — чистая функция от текущего уровня и порогов переправы; пороги принадлежат crossing definition, не зашиты в Rule"
      kind: invariant
      scope: interaction
      consumer: [replay-test, rule-review]
      evidence:
        - Rule: crossingCondition      # packages/world/src/rules/crossing-condition.ts
    - id: river-event-emission-honest
      statement: "RiverLevelChanged эмитится только когда вычисленный уровень отличается от сохранённого; CrossingConditionChanged — только при смене condition"
      kind: invariant
      scope: system
      consumer: [replay-test]
      evidence:
        - Rule: riverLevelProcess
        - Rule: crossingCondition
    - id: observer-knowledge-lag
      statement: "Offline-тики изменяют истину, но не знание игрока: наблюдатель узнаёт только через observationChannels"
      kind: impossibility
      scope: interaction
      consumer: [rule-review]
      evidence:
        - "ADR-0017 §7 observer boundary"

# ---------------------------------------------------------------------------
# OPERATIONAL PROFILE — потребители: Compiler, Scheduler (не другие системы)
# ---------------------------------------------------------------------------
operationalProfile:
  updateModel: TickDriven              # ABI §6.2: Rules слушают TickPassed
  discretization: "Циклический профиль rise → high → fall → low, один шаг на TickPassed; 'непрерывная' гидрология не допускается (D-2.0a)"
  budget:
    supports: [Full]                   # Aggregated не поддерживается:
                                       # fold/unfold контракт отсутствует (честно)
    notes: "BootstrapOnly достижим тривиально (без TickPassed нет эволюции), но как класс не декларируется до появления потребителя (Consumer Rule)"
  persistenceReplay:
    replayAssumptions:
      - "Events are totally ordered"
      - "Duplicate TickPassed is impossible"
      - "Bootstrap (RiverProcessDefined, CrossingConditionInitialized) precedes every runtime event"
      - "worldTime выводится из последовательности TickPassed, не из wall clock"
    derivedStructures: []              # кэшей нет; состояние полностью в Event Log

# ---------------------------------------------------------------------------
# PRIVATE DESIGN — внешние зависимости запрещены (V-04)
# ---------------------------------------------------------------------------
privateDesign:
  stateSemantics:
    riverBand: "Дискретизация непрерывного уровня в полосы (low/normal/high) для player-facing описания"
    crossingThresholds: "Пороги open/difficult/closed принадлежат crossing definition (Binding), не Rule (гарантия crossing-condition-derived)"
  parameterSlots:                      # D-2.3a: Definition объявляет, Binding присваивает
    - name: baselineLevel
      range: "[minimumLevel, maximumLevel]"
      default: null                    # обязателен в Binding
    - name: minimumLevel
      range: "ℝ ≥ 0"
      default: null
    - name: maximumLevel
      range: "ℝ > minimumLevel"
      default: null
    - name: cycleLengthTicks
      range: "ℕ ≥ 4"
      default: null
    - name: phaseOffset
      range: "[0, cycleLengthTicks)"
      default: 0
    - name: riseRate
      range: "ℝ > 0"
      default: null
    - name: fallRate
      range: "ℝ > 0"
      default: null
  rationale:
    - "Фиксированный цикл вместо погоды: осознанный минимум первого живого пространственного процесса (ADR-0017 §8). Weather/Season — отдельная будущая система; при её появлении river-hydrology получит dependsOn: weather с dependencyEvidence (water inflow) — это будет изменение Public Contract с проверками V-04/V-10 (§12.2)."
    - "Нет случайности вообще: профиль полностью воспроизводим из Event Log (System Determinism Principle)."

# ---------------------------------------------------------------------------
# SYSTEM BINDING (пример): pilot-region
# Значения присваиваются только объявленным слотам (D-2.3a).
# ---------------------------------------------------------------------------
bindings:
  - bindingId: pilot-region-river
    worldScope: pilot-region
    watercourseId: river_basin
    crossingId: river_crossing
    budgetClass: Full
    parameterValues: "Материализованы в bootstrap-событии RiverProcessDefined регионального компилятора (ADR-0014/0017); здесь не дублируются (DKP — покрыто bootstrapDigest, §14.1)"

# ---------------------------------------------------------------------------
# Следы в код (trace, candidate-уровень до Trace stage)
# ---------------------------------------------------------------------------
codeTraces:
  rules:
    - packages/world/src/rules/river-level.ts
    - packages/world/src/rules/crossing-condition.ts
  types:
    - packages/world/src/region/types.ts   # RiverProcessDefinition, RiverState, CrossingState, RiverBand, CrossingCondition
  tests:
    - "deterministic profile, threshold transitions, projection replay, route resolver integration, observer boundary (ADR-0017 DoD)"

# Canon depth compatibility (правило согласованности §4.2, V-10):
# TickDriven + Full поддерживает Canon-факты глубины вплоть до Simulated.
# CoreSimulation — только после Architecture Review и promotion в Core.
simulationDepthCompatibility: [NarrativeOnly, Observable, Simulated]
