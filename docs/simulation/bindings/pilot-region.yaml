# Binding: River Hydrology × Pilot Region
#
# Связывает Definition river-hydrology с конкретным миром (pilot-region).
# Содержит значения параметров, объявленных в Definition.

bindingVersion: "1.0.0"
system: river-hydrology
world:
  region: pilot-region

# =============================================================================
# Parameters — concrete values for parameterSlots declared in Definition
# =============================================================================
parameters:
  - name: baselineLevel
    value: 40

  - name: minimumLevel
    value: 20

  - name: maximumLevel
    value: 90

  - name: cycleLengthTicks
    value: 16

  - name: phaseOffset
    value: 0

  - name: riseRate
    value: 8

  - name: fallRate
    value: 5

# =============================================================================
# Crossing conditions — world-specific thresholds
# =============================================================================
crossings:
  - crossingId: river_crossing
    watercourseId: river_basin
    openAtOrBelow: 55
    difficultAtOrBelow: 75
    closedAbove: 75
    baseTravelCostTicks: 2

# =============================================================================
# Notes
# =============================================================================
# These values match the bootstrap events in:
#   packages/world/src/region/compiler.ts
#   RiverProcessDefined { baselineLevel: 40, minimumLevel: 20, ... }
#   CrossingConditionInitialized { openAtOrBelow: 55, ... }
#
# Future: When Weather system is implemented, this binding will gain:
#   waterInflow: weather.precipitation → river-hydrology
