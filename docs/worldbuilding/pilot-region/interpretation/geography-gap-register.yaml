      - visual_feature.riverwatch_main_course
      - visual-observation.coverage.coast
    blocks:
      - coastal_simulation
      - downstream_hydrology
      - canonical_toponym
    resolutionRequired: author_decision
    responsible: AuthorDecision
    lifecycle: open
