<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skald — Living World</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Skald</h1>
    <div id="status-bar">
      <span id="status-text" aria-live="polite">Connecting...</span>
      <span id="time-display">T: 0</span>
      <span id="pos-display">(0, 0)</span>
      <span id="status-details"></span>
    </div>
  </header>

  <main>
    <!-- Primary event card -->
    <section id="primary-section">
      <div id="primary-card" class="card card-primary"></div>
      <div id="notable-list"></div>
    </section>

    <!-- Map -->
    <section id="map-section">
      <div id="map-grid"></div>
    </section>

    <!-- Action panel -->
    <!-- Journal -->
    <section id="journal-section">
      <h2>Журнал</h2>
      <div id="journal-container"></div>
    </section>

    <section id="controls-section">
      <div id="dpad">
        <button id="btn-n" class="dir-btn" aria-label="Move north">&#9650;</button>
        <button id="btn-w" class="dir-btn" aria-label="Move west">&#9664;</button>
        <button id="btn-wait" class="dir-btn action-btn" aria-label="Wait">&#9632;</button>
        <button id="btn-e" class="dir-btn" aria-label="Move east">&#9654;</button>
        <button id="btn-s" class="dir-btn" aria-label="Move south">&#9660;</button>
      </div>
      <div id="social-actions">
        <button id="btn-help" class="social-btn" aria-label="Give help to guild">Помочь</button>
        <button id="btn-respect" class="social-btn" aria-label="Give respect to guild">Уважать</button>
        <button id="btn-fear" class="social-btn" aria-label="Give fear to guild">Напугать</button>
      </div>
    </section>

    <!-- Diagnostics (collapsed) -->
    <details id="diagnostics">
      <summary>Diagnostics</summary>
      <div id="event-log"></div>
      <div id="observations-list"></div>
      <div id="consequences-list"></div>
      <div id="situations-list"></div>
      <div id="relations-list"></div>
      <div id="narrative-text"></div>
      <div id="raw-input-section">
        <input type="text" id="command-input" placeholder="raw command">
        <button id="send-btn">Send</button>
        <button id="retry-btn">Retry</button>
      </div>
    </details>
  </main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
