<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skald — Living World</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <!-- Header: status + time + position -->
  <header>
    <h1>Skald</h1>
    <div id="status-bar">
      <span id="status-text" aria-live="polite" role="status">Загрузка...</span>
      <span id="time-display">T: 0</span>
      <span id="pos-display">(0, 0)</span>
    </div>
  </header>

  <!-- Tab navigation -->
  <nav id="tab-nav" role="tablist" aria-label="Основная навигация">
    <button id="tab-game" class="tab-btn active" role="tab" aria-selected="true" aria-controls="panel-game">Игра</button>
    <button id="tab-journal" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-journal">Журнал</button>
    <button id="tab-discoveries" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-discoveries">Открытия</button>
  </nav>

  <!-- Game view -->
  <main id="panel-game" role="tabpanel" aria-label="Игра">
    <!-- Primary event card -->
    <section id="primary-section">
      <div id="empty-state" class="card card-primary">Мир ждёт твоего действия.</div>
      <div id="primary-card" class="card card-primary" style="display:none"></div>
      <div id="notable-list"></div>
      <div id="suppressed-msg" style="display:none"></div>
    </section>

    <!-- D-pad + social actions -->
    <section id="controls-section">
      <div id="dpad">
        <button id="btn-n" class="dir-btn" aria-label="Move north" accesskey="w">&#9650;</button>
        <button id="btn-w" class="dir-btn" aria-label="Move west" accesskey="a">&#9664;</button>
        <button id="btn-wait" class="dir-btn action-btn" aria-label="Wait" accesskey=" ">&#9632;</button>
        <button id="btn-e" class="dir-btn" aria-label="Move east" accesskey="d">&#9654;</button>
        <button id="btn-s" class="dir-btn" aria-label="Move south" accesskey="s">&#9660;</button>
      </div>
      <div id="social-actions">
        <button id="btn-help" class="social-btn" aria-label="Give help to guild">Помочь</button>
        <button id="btn-respect" class="social-btn" aria-label="Give respect to guild">Уважать</button>
        <button id="btn-fear" class="social-btn" aria-label="Give fear to guild">Напугать</button>
      </div>
    </section>

    <!-- Map -->
    <section id="map-section" aria-label="Map">
      <div id="map-grid"></div>
    </section>
  </main>

  <!-- Journal view -->
  <div id="panel-journal" role="tabpanel" aria-label="Журнал" style="display:none">
    <div id="journal-container"></div>
  </div>

  <!-- Discoveries view -->
  <div id="panel-discoveries" role="tabpanel" aria-label="Открытия" style="display:none">
    <div id="discovery-container"></div>
  </div>

  <!-- Diagnostics (developer mode) -->
  <aside id="diagnostics-panel" role="complementary">
    <details>
      <summary>Diagnostics</summary>
      <div id="event-log"></div>
      <div id="raw-input-section">
        <input type="text" id="command-input" placeholder="raw command">
        <button id="send-btn">Send</button>
        <button id="retry-btn">Retry</button>
      </div>
    </details>
  </aside>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
