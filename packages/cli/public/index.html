<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skald — Living World</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Skald</h1>
    <div id="status-bar">
      <span id="status-text">Connecting...</span>
      <span id="time-display">T: 0</span>
      <span id="pos-display">(0, 0)</span>
    </div>
  </header>

  <main>
    <section id="map-section">
      <h2>Map</h2>
      <div id="map-grid"></div>
    </section>

    <section id="controls-section">
      <div id="command-row">
        <input type="text" id="command-input" placeholder="move north, give help to guild, wait, advance 5, narrate, narrate llm" autofocus>
        <button id="send-btn">Send</button>
        <button id="wait-btn">Wait</button>
      </div>
      <div id="advance-row">
        <input type="number" id="advance-count" value="5" min="1" max="100">
        <button id="advance-btn">Advance N</button>
        <button id="retry-btn" style="margin-left:0.5rem;">Retry</button>
      </div>
    </section>

    <section id="panels">
      <div class="panel" id="event-panel">
        <h2>Events</h2>
        <div id="event-log"></div>
      </div>
      <div class="panel" id="narrative-panel">
        <h2>Narrative</h2>
        <div id="narrative-text"></div>
      </div>
      <div class="panel" id="observations-panel">
        <h2>Observations</h2>
        <div id="observations-list"></div>
      </div>
      <div class="panel" id="consequences-panel">
        <h2>Consequences</h2>
        <div id="consequences-list"></div>
      </div>
      <div class="panel" id="situations-panel">
        <h2>Situations</h2>
        <div id="situations-list"></div>
      </div>
      <div class="panel" id="relations-panel">
        <h2>Relations</h2>
        <div id="relations-list"></div>
      </div>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
